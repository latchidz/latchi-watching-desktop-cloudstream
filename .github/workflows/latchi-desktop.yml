name: LATCHI WATCHING CloudStream Desktop validation

on:
  push:
    branches: [latchi-desktop]
    paths:
      - 'desktopApp/**'
      - 'shared/**'
      - 'library/**'
      - '.github/workflows/latchi-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msi:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build CloudStream Desktop MSI baseline
        shell: bash
        run: ./gradlew :desktopApp:packageMsi --stacktrace
      - name: Upload Windows MSI baseline
        uses: actions/upload-artifact@v4
        with:
          name: latchi-desktop-cloudstream-baseline
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 7
